services:
  app:
    image: mouaif-app:latest
    environment:
      MOUAIF_HOME: /data
      MOUAIF_ALLOW_ANY_ROOT: "1"
      MOUAIF_CHROME_URL: http://127.0.0.1:9222
    network_mode: service:chrome
    volumes:
      - ui-review-data:/data
      - ./examples/docker-test-project:/workspace/example:ro
    depends_on:
      chrome:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5732/api/settings').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
  chrome:
    image: mouaif-app:latest
    entrypoint: ["google-chrome"]
    command: ["--headless=new", "--remote-debugging-port=9222", "--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage", "about:blank"]
    # Chrome binds CDP to loopback. The app shares this network namespace;
    # publish only the app port, never the unauthenticated debugging port.
    ports:
      - "5732:5732"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9222/json/version').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

volumes:
  ui-review-data:
