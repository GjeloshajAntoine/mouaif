<!doctype html>
<!--
  mouaif web entry. Served by `mouaif serve` at / (the root).

  Build:
    npm run build:web      # writes frontend/dist/

  Dev (with HMR):
    npm run dev:web        # vite dev server on :5173 (optional)

  The script and style references are relative so Vite can resolve and
  hash them at build time. The base URL in vite.config.js keeps the
  bundle absolute at the root when it is served.

  This page is the mobile UI for mouaif. It is a Preact + Vite app
  served from frontend/dist/ by the Node server. See docs/decisions.md
  sections 7 and 8.

  PWA plumbing:
    - <link rel="manifest"> declares the app metadata. Served from
      public/manifest.webmanifest (Vite copies public/ verbatim into
      dist/, so the absolute URL /manifest.webmanifest matches
      what the browser expects).
    - apple-mobile-web-app-* meta tags make the page installable on
      iOS Safari (Apple doesn't honour the manifest scope field, so
      the iOS-specific tags are required for an Add-to-Home-Screen
      experience there).
    - <link rel="apple-touch-icon"> points at the same 180x180 PNG
      the manifest exposes. iOS picks this up when the user taps
      Share → Add to Home Screen.
    - The service worker is registered from src/main.jsx (after the
      first paint, in production builds only — dev mode skips it so
      HMR stays fast and stale code doesn't get cached).
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#111418" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="mouaif — chat with AI providers, manage prompts, run tools against your projects." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="mouaif" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180-apple.png" />
  <title>mouaif</title>
  <!--
    Paint the page background before the bundle's stylesheet arrives.

    Without this rule the app's first frame is the browser's default canvas:
    #fff without a color-scheme hint, #121212 with `color-scheme: dark`. Both
    are a full-screen fill in a colour the app never shows — reported as
    "grey flashes with page reload". The document's own background came from
    the `@import`-ed index CSS, and that external stylesheet is requested
    before the module script runs, so between the document commit and the
    arrival of the CSS the browser paints the canvas instead of the app.

    Two details make this rule the right fix rather than a workaround:
      - the inline <style> is part of the document, so it applies at the
        first paint — the default canvas is never composited;
      - the rule is EXACTLY the bundle's `html` background, with `var(--bg)`
        resolved to its literal `#0a0d12`. The bundle's CSS re-declares the
        same `background` value a tick later, so the swap is a repaint of
        the identical pixel stack rather than a step. An earlier rule set
        only the solid base colour, which painted correctly on first frame
        but then stepped visibly to the same base colour plus the accent
        glow once the bundle's CSS landed.

    Keep this block in sync with the `html` rule in
    frontend/src/base.css (its --bg token and its background stack), and
    keep this rule BEFORE the bundler-injected `<link rel="stylesheet">`
    (Vite appends it at the end of <head>): the bundle's `html` rule sets
    the same `background` property at equal specificity, so coming later
    on equal footing is exactly what lets the no-op repaint run after the
    first paint. scripts/test-index-first-paint.mjs asserts all three
    facts.
  -->
  <style>html{background:radial-gradient(900px 420px at 50% 110%,rgba(110,168,254,.045),transparent 60%),#0a0d12}</style>
  <script type="module" crossorigin src="/assets/index-D0AWQr4S.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-sqbQ5ptX.css">
</head>
<body>
  <main id="app"></main>
</body>
</html>
