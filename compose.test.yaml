# Resource caps keep the run to a small slice of the host (0.75 CPU and
# 512 MiB in total by default); override them from the environment, e.g.
# `MOUAIF_APP_CPUS=1 npm run test:docker`.
services:
  app:
    build:
      context: .
    environment:
      MOUAIF_HOME: /data
      MOUAIF_ALLOW_ANY_ROOT: "1"
      NODE_OPTIONS: --max-old-space-size=${MOUAIF_APP_HEAP_MB:-256}
    cpus: ${MOUAIF_APP_CPUS:-0.5}
    mem_limit: ${MOUAIF_APP_MEM:-384m}
    memswap_limit: ${MOUAIF_APP_MEM:-384m}
    pids_limit: 256
    volumes:
      - test-data:/data
      - ./examples/docker-test-project:/workspace/example:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5732/api/settings').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  test:
    image: node:24-bookworm-slim
    cpus: ${MOUAIF_TEST_CPUS:-0.25}
    mem_limit: ${MOUAIF_TEST_MEM:-128m}
    memswap_limit: ${MOUAIF_TEST_MEM:-128m}
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:5732
      PROJECT_DIR: /workspace/example
    volumes:
      - ./scripts/docker-smoke-test.js:/test/docker-smoke-test.js:ro
    command: ["node", "/test/docker-smoke-test.js"]

volumes:
  test-data:
