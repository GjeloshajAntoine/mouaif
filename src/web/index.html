<!doctype html>
<!--
  mouaif web entry. Served by `mouaif serve` at /web/.
  This page is the demo for the virtual list primitive. It also doubles as
  the placeholder shell for the future Preact + Vite mobile UI; see
  docs/decisions.md sections 7 and 8.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111418" />
  <title>mouaif</title>
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">mouaif</h1>
      <p class="app__sub">Virtual list demo</p>
    </header>

    <section class="demo">
      <p class="demo__hint">
        10 000 rows, 44 px each, overscan 4. Scroll fast — only ~12 DOM nodes exist.
      </p>
      <div id="scroller" class="demo__scroller" tabindex="0" aria-label="List of 10000 items"></div>
      <p id="stats" class="demo__stats" aria-live="polite"></p>
    </section>
  </main>

  <!-- Mobile-first, no build step yet. Preact + Vite land in a later commit. -->
  <script type="module" src="/web/main.js"></script>
</body>
</html>
