<!doctype html>
<!--
  mouaif web entry. Served by `mouaif serve` at /web/.
  This page is the demo for the virtual list primitive. It also doubles as
  the placeholder shell for the future Preact + Vite mobile UI; see
  docs/decisions.md sections 7 and 8.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111418" />
  <title>mouaif</title>
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1 class="app__title">mouaif</h1>
      <p class="app__sub">Virtual list demo</p>
    </header>

    <section class="demo">
      <p class="demo__hint">
        10 000 rows, 44 px each, overscan 4. Scroll fast — only ~12 DOM nodes exist.
      </p>
      <div id="scroller" class="demo__scroller" tabindex="0" aria-label="List of 10000 items"></div>
      <p id="stats" class="demo__stats" aria-live="polite"></p>
    </section>

    <section class="chat">
      <h2 class="chat__title">AI test</h2>
      <p class="chat__hint">Send a single message through <code>/api/ai/chat</code>. Pick a model in app settings first.</p>
      <div class="chat__row">
        <label for="modelId" class="chat__label">Model id</label>
        <input id="modelId" class="chat__input" type="text" placeholder="e.g. gpt-4o-mini" />
      </div>
      <div class="chat__row">
        <label for="prompt" class="chat__label">Prompt</label>
        <textarea id="prompt" class="chat__input" rows="2" placeholder="Say something"></textarea>
      </div>
      <div class="chat__row chat__row--actions">
        <button id="send" class="chat__send" type="button">Send</button>
        <span id="chatStatus" class="chat__status" aria-live="polite"></span>
      </div>
      <pre id="chatOut" class="chat__out" aria-label="Assistant reply"></pre>
    </section>
  </main>

  <!-- Mobile-first, no build step yet. Preact + Vite land in a later commit. -->
  <script type="module" src="/web/main.js"></script>
</body>
</html>
