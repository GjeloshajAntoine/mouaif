name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: git diff --exit-code -- frontend/dist
      # The docs site is deployed from docs/ on master (GitHub Pages,
      # "Deploy from a branch"). Fail if the committed output has drifted
      # from the Markdown sources, so docs and site can never disagree.
      - run: npm run docs:publish:check
