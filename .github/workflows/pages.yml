name: Docs site

# Builds the public documentation site and deploys it to GitHub Pages.
# Only the user guide is published: scripts/build-docs.js is run without
# --with-internal, so the decisions log (docs/decisions.md) and the agent
# implementation notes (docs/agent/features/*.md) are never written into the
# published artifact.
#
# One-time setup per repository:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/build-docs.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build public docs site
        run: node scripts/build-docs.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
