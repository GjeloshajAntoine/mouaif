<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>mouaif — tool review</title>
  <link rel="stylesheet" href="./mockup.css">
</head>
<body>
  <nav class="review-bar" aria-label="Review controls">
    <div class="review-bar__row">
      <select id="view" aria-label="Show"><option value="results">Results</option><option value="approvals">Approvals</option></select>
      <select id="family" aria-label="Family"><option value="all">All families</option></select>
      <input id="search" type="search" placeholder="Filter tool…">
      <span id="visible-count" class="review-bar__count" role="status"></span>
    </div>
    <div class="review-bar__row">
      <select id="render-path" aria-label="Render path"><option value="call-first">Call → result</option><option value="result-first">Result first</option><option value="reconciled">Replay</option></select>
      <button id="expand" type="button">Expand</button>
      <button id="collapse" type="button">Collapse</button>
      <button id="reconcile" type="button">Replay</button>
      <button id="reset-approvals" type="button" hidden>Reset</button>
    </div>
    <p id="review-status" class="review-bar__status" role="status" aria-live="polite" hidden></p>
    <span id="coverage" hidden></span>
  </nav>
  <main>
    <div id="tools"></div>
    <p id="no-matches" hidden>No matching tools.</p>
    <section id="states" aria-label="Interaction states"></section>
  </main>
  <script src="./mockup.js"></script>
</body>
</html>
